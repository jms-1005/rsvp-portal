<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RSVP Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <a class="brand" href="#/invites"><span class="dot"></span> RSVP Portal</a>
    <nav>
      <a href="#/invites" data-nav="invites">My invites</a>
      <a href="#/events" data-nav="events">My events</a>
      <button class="link" id="signout">Sign out</button>
    </nav>
  </header>

  <main id="app" class="container">
    <p class="muted">Loading…</p>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- 1. Supabase client library (pinned version) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <!-- 2. Your project keys -->
  <script src="js/config.js"></script>
  <!-- 3. The app -->
  <script src="js/app.js"></script>
</body>
</html>
